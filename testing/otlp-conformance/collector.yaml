# The receiver under test: the official OpenTelemetry Collector (contrib distribution), OTLP over
# gRPC and HTTP in, a file exporter per signal out (OTLP JSON, one request per line).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  file/traces:
    path: /traces.json
  file/metrics:
    path: /metrics.json
  file/logs:
    path: /logs.json
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
