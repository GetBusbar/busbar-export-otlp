# RENDERED by `cargo xtask fleet render busbar-export-otlp` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      service: none
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      plugin_crate: busbar-export-otlp-plugin
      manifest_name: busbar-export-otlp
      plugin_alias: otlp
      plugin_kind: export
      asset_prefix: busbar-export-otlp
      description: "First-party signed kind:export plugin cdylib: the OTLP trace export sink (module: otlp), packaged as a droppable busbar plugin. Drop the signed tarball into plugins/ and name it from an export.<name>.module: otlp block."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "export-otlp/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-export-otlp
      plugin_name: busbar-export-otlp
      plugin_alias: otlp
      plugin_kind: export
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
